name: M2 isolated acceptance
on:
  pull_request:
    branches: [acceptance/m2-owner-continuity]
  push:
    branches: ['phantom/**']
permissions:
  contents: read
jobs:
  validate:
    name: m2-real-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the scoped documentation
        run: |
          test -s docs/m2-acceptance.md
          grep -q '^# ' docs/m2-acceptance.md
          test -s README.md
          if test -f docs/m2-ci-acceptance.md; then
            grep -Fq 'CI follow-ups resume the same owner session.' docs/m2-ci-acceptance.md || {
              echo 'CI validation failed: add the exact sentence "CI follow-ups resume the same owner session." to docs/m2-ci-acceptance.md.'
              exit 1
            }
          fi
